# Deploys the official Tony D site as a Workers static-assets project.
#
# This repository, tonyd-official/Tony_Deng_Website, is the site. Every push
# to `main` deploys it: .github/workflows/deploy.yml runs
# `python build.py --dist`, which renders every page in both languages from
# content/*.json and assembles dist/, then `wrangler deploy` uploads what
# this file points at. There is no Cloudflare-side build.
# dist/ is gitignored on purpose, so it only ever exists as build output.
#
# The admin API runs inside this same Worker. `main` is the admin script,
# but `run_worker_first` hands it /api/admin/* (and the media and reveal paths
# below) only; every other request is
# answered from dist/ without the script running at all, so the public site
# costs nothing extra and cannot be broken by the admin.
#
# It lives here rather than in its own Worker because a separate Worker can
# only be attached to a path on a custom domain, and this site is still on
# workers.dev. Once there is a domain, it can move back behind Cloudflare
# Access — see the note at the top of workers/admin/src/index.js.
name = "tony-deng-website"
main = "workers/admin/src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# /audio/* and /video/* so seeking works (the Worker answers byte ranges),
# /reveal/* so a countdown's picture is served only after its moment.
# /api/message is the public "Message Tony" form.
run_worker_first = ["/api/admin/*", "/api/message", "/audio/*", "/video/*", "/reveal/*"]

[vars]
# The repository the admin writes to. Save draft commits to DRAFT_BRANCH;
# Publish merges it into LIVE_BRANCH, and that push to main deploys.
GITHUB_REPO = "tonyd-official/Tony_Deng_Website"
LIVE_BRANCH = "main"
DRAFT_BRANCH = "draft"

# Secrets, never in this file. Set them in the Cloudflare dashboard:
# this Worker -> Settings -> Variables and Secrets -> Add -> type Secret.
#   GITHUB_TOKEN    fine-grained PAT, only this repo, Contents: read & write
#   ADMIN_PASSWORD  the owner password: TonyDeng signs in with it, removing
#                   TonyDeng asks for it, and changing it signs everyone out
#   BREVO_API_KEY   sends the admin's and the message form's emails
#   MAIL_FROM       the sender address verified in Brevo
# Secrets survive deploys; plain variables added in the dashboard do not,
# which is why the ones above live here. The repository is public, so no
# token or password may ever be written into this file.

# Sign-ins, the "where messages go" setting and the message inbox. Without
# this binding the admin keeps the single ADMIN_PASSWORD and messages can
# only be emailed. To switch it on: Cloudflare dashboard -> Storage &
# Databases -> KV -> Create, name it tony-admin, then put its ID below and
# remove the #s. The ID is not a secret.
# [[kv_namespaces]]
# binding = "ACCOUNTS"
# id = ""
